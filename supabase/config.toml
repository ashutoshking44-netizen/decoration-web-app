# Supabase Project Configuration
# Documentation: https://supabase.com/docs/guides/cli/config

project_id = "decoration-web-app"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5174"
additional_redirect_urls = ["https://127.0.0.1:5174"]
jwt_expiry = 3600
enable_signup = true

[functions.upload-photo]
verify_jwt = false
